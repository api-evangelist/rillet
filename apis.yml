image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/rillet.png
name: Rillet
description: >-
  Rillet is an AI-native, cloud enterprise resource planning (ERP) and general-ledger
  platform built for modern finance teams. It automates core accounting workflows —
  general ledger, accounts receivable and payable, bank reconciliation, revenue and
  contract management, month-end close, and financial reporting — and layers on "Aura AI"
  for natural-language querying and workflow automation. The Rillet Accounting API (OpenAPI
  3.1, 110 operations) exposes accounts, subsidiaries, customers, vendors, products,
  contracts, invoices, credit memos, bills, journal entries, bank accounts/transactions,
  reimbursements, and financial-statement reports, with bearer/OAuth2 auth, RFC 9457
  errors, idempotency, keyset pagination, signed webhooks, and an official hosted MCP
  server. Rillet is backed by Creandum, First Round Capital, and ICONIQ.
