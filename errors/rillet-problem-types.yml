  detail: The requested resource does not exist.
- status: 409
  title: Conflict
  detail: The request conflicts with the current state of the resource.
- status: 422
  title: Unprocessable Entity
  detail: Semantically invalid request (e.g. accounting rule violation).
- status: 429
  title: Too Many Requests
  detail: Rate limit of 60 requests per rolling minute exceeded.
- status: 500
